<body data-page="playground">
<main id="lma-main" class="lma-main lma-main-wide"><h1 class="h3">Code Playground</h1><p class="lma-muted">Code edit, copy aur compare kar sakte ho. PHP yahan run nahi hota, run karne ke liye apna Laravel project use karo.</p>
<div class="lma-pg-bar"><label class="visually-hidden" for="pg-lang">Language</label><select id="pg-lang" class="form-select form-select-sm w-auto"><option value="php">PHP</option><option value="html">Blade / HTML</option><option value="js">JavaScript</option><option value="sql">SQL</option><option value="bash">Terminal</option></select>
<button type="button" class="btn btn-sm btn-outline-secondary" id="pg-copy"><i class="bi bi-clipboard"></i> Copy</button><button type="button" class="btn btn-sm btn-outline-secondary" id="pg-reset">Reset</button><button type="button" class="btn btn-sm btn-outline-secondary" id="pg-compare" aria-pressed="false">Before / After</button></div>
<div class="lma-pg-panes"><div class="lma-code"><div class="lma-code-head"><span>Aapka code (after)</span></div><textarea id="pg-code"></textarea></div><div class="lma-code d-none" id="pg-orig-wrap"><div class="lma-code-head"><span>Original (before)</span></div><textarea id="pg-orig" readonly></textarea></div></div></main>
