<body data-page="course">
<main id="lma-main" class="lma-main lma-main-wide"><h1 class="h3">Course</h1><p class="lma-muted mb-0" id="co-sub"></p>
<div class="lma-filters" role="search" aria-label="Course filters"><input id="co-q" class="form-control form-control-sm" type="search" placeholder="Lesson ya module…" aria-label="Filter lessons">
<select id="co-level" class="form-select form-select-sm" aria-label="Level"><option value="">All levels</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option><option value="expert">Expert</option></select>
<select id="co-status" class="form-select form-select-sm" aria-label="Status"><option value="">All lessons</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="bookmarked">Bookmarked</option></select>
<div class="btn-group btn-group-sm" role="group" aria-label="View"><button type="button" class="btn btn-outline-secondary" id="co-v-modules">Modules</button><button type="button" class="btn btn-outline-secondary" id="co-v-table">Table</button></div></div>
<div id="co-modules"></div><div id="co-table-wrap" class="d-none"><table id="co-table" class="table"><thead><tr><th>Module</th><th>Lesson</th><th>Level</th><th>Time</th><th>Status</th></tr></thead><tbody></tbody></table></div></main>
