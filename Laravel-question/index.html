<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laravel Interview Mastery — 100 Question Practice Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ===================== Desktop Sidebar container ===================== -->
  <aside class="sidebar-panel d-none d-lg-flex" id="sidebarDesktopHost"></aside>

  <!-- ===================== Main Column ===================== -->
  <div class="main-column">

    <!-- Mobile header -->
    <div class="mobile-header">
      <button class="icon-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
        <i class="bi bi-list"></i>
      </button>
      <div class="mobile-header-title">
        <span>Laravel Interview Mastery</span>
      </div>
      <button class="icon-btn" id="themeToggleMobile" type="button" aria-label="Toggle theme">
        <i class="bi bi-sun"></i>
      </button>
    </div>

    <!-- Desktop header -->
    <header class="top-header">
      <div class="header-row">
        <div class="header-title-block">
          <h1>Laravel Interview Mastery</h1>
          <p>100 Questions · Basic → Advanced · Built for ~5 years experience interviews</p>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="header-progress-block">
            <span class="header-progress-label" id="headerProgressText">0 / 100 Completed</span>
            <div class="header-progress-track">
              <div class="header-progress-fill" id="headerProgressBar" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
          <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle theme">
            <i class="bi bi-sun"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Counter bar -->
    <div class="counter-bar">
      <span id="questionCounter">Question 1 of 100</span>
      <span class="level-pill badge-basic" id="levelBadgeTop">🟢 Basic</span>
      <span class="percent-badge" id="percentBadge">1%</span>
    </div>

    <!-- Question content -->
    <main class="content-scroll" id="mainContent">
      <div class="question-card" id="questionContent"></div>
    </main>

    <!-- Nav footer -->
    <footer class="nav-footer">
      <div class="nav-footer-progress d-none d-md-flex align-items-center gap-2">
        <div class="progress" style="width:160px; height:6px; background:var(--border-soft);" role="progressbar" aria-label="Overall progress">
          <div class="progress-bar" id="progressBar" style="width:0%; background: var(--accent);"></div>
        </div>
        <span style="font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--text-muted);" id="progressCount">0 / 100 Completed</span>
      </div>

      <div class="nav-footer-buttons">
        <button class="nav-btn" id="prevBtn" type="button">
          <i class="bi bi-arrow-left"></i><span class="btn-label">Previous</span>
        </button>

        <button class="nav-btn study-btn" id="studyBtn" type="button">
          <i class="bi bi-bookmark-check"></i><span class="btn-label">Mark as Read</span>
        </button>

        <button class="nav-btn" id="nextBtn" type="button">
          <span class="btn-label">Next</span><i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </footer>
  </div>
</div>

<!-- ===================== Mobile Offcanvas Sidebar (host, filled via JS) ===================== -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel" style="width: 320px;">
  <div class="offcanvas-header" style="border-bottom:1px solid var(--border);">
    <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Questions</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body p-0 d-flex flex-column" id="sidebarOffcanvasHost"></div>
</div>

<!-- ===================== The single, shared sidebar content ===================== -->
<template id="sidebarTemplate">
  <div class="sidebar-brand">
    <div class="sidebar-brand-mark">
      <div class="brand-glyph">&lt;/&gt;</div>
      <div>
        <div class="sidebar-brand-title">Laravel Interview Mastery</div>
        <div class="sidebar-brand-sub">100 Questions · Basic → Advanced</div>
      </div>
    </div>
  </div>
  <div class="sidebar-search-filters">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Search questions...">
    </div>
    <div class="filter-chips" id="filterChips">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="basic">Basic</button>
      <button class="filter-chip" data-filter="intermediate">Intermediate</button>
      <button class="filter-chip" data-filter="advanced">Advanced</button>
      <button class="filter-chip" data-filter="completed">Completed</button>
      <button class="filter-chip" data-filter="pending">Pending</button>
    </div>
  </div>
  <div class="sidebar-list-wrap" id="sidebarList"></div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
