<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator With Logo</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      color: #1f2937;
      background: #eef2f7;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page-card {
      border: none;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }

    .page-card h1 {
      font-size: clamp(1.75rem, 2.2vw, 2.5rem);
      letter-spacing: -0.02em;
    }

    .form-label {
      font-weight: 600;
      color: #334155;
    }

    .form-control {
      border-radius: 14px;
      padding: 1rem 1rem;
      min-height: 3.2rem;
    }

    .btn-custom {
      border-radius: 14px;
      padding: 0.9rem 1.25rem;
      font-weight: 600;
    }

    #qrcode {
      max-width: 340px;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.16);
      transition: transform 0.3s ease;
    }

    #qrcode:hover {
      transform: translateY(-2px);
    }

    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #logoPreview {
      position: absolute;
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 18px;
      background: #ffffff;
      padding: 10px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.12);
      display: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .action-row {
      gap: 0.9rem;
    }

    .helper-text {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .status-message {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      transition: opacity 0.25s ease;
    }

    .status-message span {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-success {
      color: #0f766e;
    }

    .status-error {
      color: #b91c1c;
    }

    .logo-preview-box {
      border: 1px dashed rgba(148, 163, 184, 0.6);
      border-radius: 16px;
      padding: 1rem;
      background: #f8fafc;
    }

    .logo-preview-box img {
      max-width: 100%;
      border-radius: 16px;
      display: block;
    }

    @media (max-width: 576px) {
      .page-card {
        padding: 1.5rem 1rem;
      }

      .action-row {
        flex-direction: column;
      }

      #logoPreview {
        width: 72px;
        height: 72px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-7 col-lg-8 col-md-10">
      <div class="page-card p-5">
        <div class="mb-4 text-center">
          <span class="badge rounded-pill bg-info bg-opacity-15 text-info mb-3 text-white">Fast • Mobile-friendly • Logo support</span>
          <h1 class="mb-2">QR Code Generator</h1>
          <p class="helper-text mx-auto" style="max-width: 38rem;">
            Create a crisp QR code instantly. Upload a logo and download the image in PNG format with one click.
          </p>
        </div>

        <div class="mb-4">
          <label for="urlInput" class="form-label">Website or text</label>
          <input type="text" id="urlInput" class="form-control" placeholder="https://example.com or your message" autocomplete="off">
        </div>

        <div class="row g-3 mb-4">
          <div class="col-sm-7">
            <label for="sizeSelect" class="form-label">QR size</label>
            <select id="sizeSelect" class="form-select">
              <option value="240">Small (240px)</option>
              <option value="320" selected>Medium (320px)</option>
              <option value="420">Large (420px)</option>
              <option value="1080">Extra Large (1080px)</option>
              <option value="1420">Large (1420px)</option>
              <option value="2520">Extra Large (2520px)</option>
              <option value="5220">Extra Large (5220px)</option>
            </select>
          </div>
          <div class="col-sm-5">
            <label for="logoInput" class="form-label">Upload logo</label>
            <input type="file" id="logoInput" class="form-control" accept="image/*">
          </div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="d-flex flex-column flex-sm-row action-row mb-4">
          <button id="generateBtn" class="btn btn-primary btn-custom flex-grow-1" type="button">Generate QR Code</button>
          <button id="downloadBtn" class="btn btn-success btn-custom flex-grow-1" type="button" disabled>Download QR Code</button>
          <button id="copyBtn" class="btn btn-outline-secondary btn-custom flex-grow-1" type="button" disabled>Copy text</button>
        </div>

        <div id="qrcode" class="mb-4">
          <img id="logoPreview" alt="Logo preview" />
          <div class="text-center text-slate-500 helper-text">Your generated QR code will appear here.</div>
        </div>

        <div class="logo-preview-box d-none" id="logoDetails">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <strong>Logo uploaded</strong>
              <p class="mb-0 text-muted">You can remove or replace the logo before downloading.</p>
            </div>
            <button id="clearLogoBtn" class="btn btn-sm btn-outline-danger">Remove</button>
          </div>
          <img id="logoThumb" alt="Logo thumbnail" />
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  const urlInput = document.getElementById('urlInput');
  const logoInput = document.getElementById('logoInput');
  const logoPreview = document.getElementById('logoPreview');
  const logoThumb = document.getElementById('logoThumb');
  const logoDetails = document.getElementById('logoDetails');
  const statusMessage = document.getElementById('statusMessage');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearLogoBtn = document.getElementById('clearLogoBtn');
  const sizeSelect = document.getElementById('sizeSelect');
  const qrContainer = document.getElementById('qrcode');

  let logoData = '';
  let currentSize = Number(sizeSelect.value);

  function showMessage(text, type = 'success') {
    statusMessage.innerHTML = `<span class="${type === 'error' ? 'status-error' : 'status-success'}">${text}</span>`;
  }

  function clearMessage() {
    statusMessage.innerHTML = '';
  }

  function validateText(input) {
    return input.length > 0;
  }

  function toggleButtons(enabled) {
    downloadBtn.disabled = !enabled;
    copyBtn.disabled = !enabled;
  }

  logoInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) {
      return;
    }

    const reader = new FileReader();
    reader.onload = function (e) {
      logoData = e.target.result;
      logoPreview.src = logoData;
      logoPreview.style.display = 'block';
      logoThumb.src = logoData;
      logoDetails.classList.remove('d-none');
      showMessage('Logo ready to embed in the QR code.');
    };
    reader.readAsDataURL(file);
  });

  clearLogoBtn.addEventListener('click', () => {
    logoData = '';
    logoInput.value = '';
    logoPreview.src = '';
    logoPreview.style.display = 'none';
    logoThumb.src = '';
    logoDetails.classList.add('d-none');
    showMessage('Logo removed.');
  });

  generateBtn.addEventListener('click', () => {
    const text = urlInput.value.trim();
    if (!validateText(text)) {
      showMessage('Please enter a URL or text to generate the QR code.', 'error');
      return;
    }

    clearMessage();
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';

    qrContainer.querySelectorAll('canvas, .helper-text').forEach((child) => {
      if (child.tagName === 'CANVAS' || child.classList.contains('helper-text')) {
        child.remove();
      }
    });

    currentSize = Number(sizeSelect.value);

    QRCode.toCanvas(text, {
      width: currentSize,
      margin: 2,
      errorCorrectionLevel: 'H'
    }, (error, canvas) => {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate QR Code';

      if (error) {
        console.error(error);
        showMessage('Unable to generate QR code. Try a shorter text or different input.', 'error');
        return;
      }

      qrContainer.prepend(canvas);
      showMessage('QR code generated successfully.');
      toggleButtons(true);
    });
  });

  downloadBtn.addEventListener('click', () => {
    const canvas = qrContainer.querySelector('canvas');
    if (!canvas) {
      showMessage('Generate a QR code before downloading.', 'error');
      return;
    }

    const finalCanvas = document.createElement('canvas');
    const ctx = finalCanvas.getContext('2d');
    finalCanvas.width = currentSize;
    finalCanvas.height = currentSize;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
    ctx.drawImage(canvas, 0, 0, finalCanvas.width, finalCanvas.height);

    if (logoData) {
      const logo = new Image();
      logo.src = logoData;
      logo.onload = () => {
        const logoSize = Math.round(finalCanvas.width * 0.22);
        const x = (finalCanvas.width - logoSize) / 2;
        const y = (finalCanvas.height - logoSize) / 2;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - 8, y - 8, logoSize + 16, logoSize + 16);
        ctx.drawImage(logo, x, y, logoSize, logoSize);
        downloadImage(finalCanvas);
      };
      logo.onerror = () => {
        showMessage('Could not load the logo. Downloading QR without logo.', 'error');
        downloadImage(finalCanvas);
      };
    } else {
      downloadImage(finalCanvas);
    }
  });

  copyBtn.addEventListener('click', async () => {
    const text = urlInput.value.trim();
    if (!text) {
      showMessage('Enter content before copying.', 'error');
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      showMessage('Text copied to clipboard.');
    } catch (error) {
      console.warn(error);
      showMessage('Unable to copy automatically. Please copy manually.', 'error');
    }
  });

  function downloadImage(canvas) {
    const link = document.createElement('a');
    link.download = 'qr-code.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
</body>
</html>
